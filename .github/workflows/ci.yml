name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Версия Gradle
        id: gradle
        run: |
          echo "version=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip/\1/p' \
            gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Проверки
        run: gradle ktlintCheck lintRelease testDebugUnitTest

      - name: Релизная сборка
        run: gradle assembleRelease

      - name: Отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/apk/release/
          retention-days: 7
