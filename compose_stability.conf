// Compose compiler stability configuration.
//
// The domain models are immutable by construction: every class is a `data class` of `val`s, they are
// built once by the scan pipeline and never mutated. The compiler cannot prove that on its own,
// because `List` is an interface with mutable implementations — so `InstalledApp` is inferred
// unstable, and every row of a 473-item list recomposes whenever its parent does.
//
// Declaring them stable here rather than annotating them with @Immutable keeps `androidx.compose`
// out of the domain layer, which is the whole point of that layer being pure Kotlin.
//
// The contract this asserts: nothing below is ever mutated after construction. Breaking it means
// stale UI, so treat these types as read-only.
app.vazovsky.permaware.domain.model.*
app.vazovsky.permaware.domain.attention.*
app.vazovsky.permaware.domain.permission.*

// We never pass a mutable list into a composable; all lists originate from the domain layer above.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
