org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableR8.fullMode=true

kotlin.code.style=official
ksp.incremental=true

# The outbound URLs in the app. Read at build time into BuildConfig and surfaced through
# core/config/AppLinks.kt; nothing else in the codebase may hard-code a URL.
permaware.boostyUrl=https://boosty.to/vazovsky17
permaware.githubUrl=https://github.com/vazovsky17/PermAware
permaware.contactUrl=https://t.me/vazovsky17

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
